# systemd-tmpfiles fragment — the shared KGSM state tree.
#
# These paths are written by several packages and owned by none of them, so they are declared once
# here rather than by whichever leaf happens to be installed first. A leaf's OWN state directory is
# deliberately absent: every unit carries StateDirectory=, which systemd creates owned by User=
# before ExecStart, so provisioning one costs no privilege and belongs to no package.
#
#   events/            the engine's event journal — every producer appends, every consumer tails
#   leaves/            the leaf config descriptors kgsm-api scans to render the configuration page
#   leaves/commands/   the leaf command manifests, one level down because the descriptor scan
#                      globs *.json above and would read a manifest there as a malformed descriptor
#   auth/              the KGSM account store. 0700 because it holds password hashes, and a
#                      directory rather than a bare file because SQLite writes -wal and -shm beside
#                      the database — write permission on the file alone is not enough.
#   cluster/           what several members of a cluster on one machine share. A member's OWN roster,
#                      outbox and inbox are deliberately NOT here: each keeps those under its unit's
#                      StateDirectory=, so two members on one machine share nothing that would make
#                      one's membership depend on the other's process.

d /var/lib/kgsm                  0755 kgsm kgsm -
d /var/lib/kgsm/events           0755 kgsm kgsm -
d /var/lib/kgsm/leaves           0755 kgsm kgsm -
d /var/lib/kgsm/leaves/commands  0755 kgsm kgsm -
d /var/lib/kgsm/auth             0700 kgsm kgsm -
d /var/lib/kgsm/cluster          0755 kgsm kgsm -
